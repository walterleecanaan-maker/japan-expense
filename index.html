<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Walter & Cherry 旅遊手冊</title>
  <style>
    :root {
      --primary: #ff6b81;
      --primary-hover: #ff4757;
      --bg: #f7f9fc;
      --card-bg: #ffffff;
      --text: #2f3542;
      --subtext: #747d8c;
      --border: #eccc68;
      --shadow: 0 4px 15px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }

    /* Header */
    header { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); color: white; padding: 20px 15px; text-align: center; border-radius: 0 0 20px 20px; box-shadow: var(--shadow); }
    header h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 5px; }
    header p { font-size: 0.85rem; opacity: 0.9; }

    /* Navigation Tabs */
    .nav-tabs { display: flex; justify-content: space-around; background: white; margin: 15px; padding: 6px; border-radius: 30px; box-shadow: var(--shadow); }
    .nav-btn { flex: 1; padding: 10px; text-align: center; border: none; background: transparent; font-size: 0.95rem; font-weight: 600; color: var(--subtext); border-radius: 20px; cursor: pointer; transition: all 0.3s; }
    .nav-btn.active { background: var(--primary); color: white; }

    /* Main Container */
    .container { padding: 0 15px; max-width: 600px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards */
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 15px; margin-bottom: 15px; box-shadow: var(--shadow); }

    /* Stats Overview Dashboard */
    .stats-card { background: linear-gradient(135deg, #2ed573, #1e90ff); color: white; padding: 15px; border-radius: var(--radius); margin-bottom: 15px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; margin-top: 10px; }
    .stats-item h4 { font-size: 0.75rem; opacity: 0.8; margin-bottom: 3px; }
    .stats-item p { font-size: 1.1rem; font-weight: bold; }

    /* Filter Pills */
    .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; }
    .filter-pill { padding: 6px 14px; background: #eef2f5; border-radius: 20px; font-size: 0.85rem; color: var(--subtext); border: none; white-space: nowrap; cursor: pointer; }
    .filter-pill.active { background: var(--text); color: white; }

    /* Timeline (Schedule) */
    .timeline { position: relative; padding-left: 20px; border-left: 2px solid #dfe4ea; margin-left: 10px; }
    .timeline-item { position: relative; margin-bottom: 20px; }
    .timeline-dot { position: absolute; left: -26px; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); border: 2px solid white; }
    .timeline-card { background: white; padding: 12px; border-radius: var(--radius); box-shadow: var(--shadow); }
    .timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .timeline-time { font-size: 0.8rem; font-weight: bold; color: var(--primary); }
    .timeline-title { font-weight: bold; font-size: 1rem; margin-bottom: 4px; }
    .timeline-location { font-size: 0.85rem; color: var(--subtext); }

    /* Record Items (Expense & Notes) */
    .record-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f2f6; }
    .record-item:last-child { border-bottom: none; }
    .record-info h3 { font-size: 0.95rem; margin-bottom: 4px; }
    .record-info p { font-size: 0.8rem; color: var(--subtext); }
    .record-amount { text-align: right; }
    .amount-jpy { font-weight: bold; font-size: 1rem; color: var(--text); }
    .amount-hkd { font-size: 0.8rem; color: var(--subtext); }
    .record-actions { display: flex; gap: 8px; margin-top: 4px; font-size: 0.75rem; }
    .edit-btn { color: #1e90ff; cursor: pointer; }
    .delete-btn { color: #ff4757; cursor: pointer; }

    /* Form Styles */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: var(--text); }
    .form-control { width: 100%; padding: 10px; border: 1px solid #dfe4ea; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }

    /* Modal Popup */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: flex-end; }
    .modal.active { display: flex; }
    .modal-content { background: white; width: 100%; max-width: 600px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s forwards; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .modal-close { font-size: 1.5rem; border: none; background: none; cursor: pointer; color: var(--subtext); }

    /* Floating Action Button (FAB) */
    .fab { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--primary); color: white; font-size: 1.8rem; border: none; box-shadow: 0 4px 10px rgba(255, 107, 129, 0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 900; }

    /* Utility */
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--primary); color: white; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .empty { text-align: center; color: var(--subtext); padding: 30px 0; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1>🇯🇵 Walter & Cherry 旅遊手冊</h1>
    <p>行程規劃 • 記帳 • 備忘錄</p>
  </header>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab('expense')">💰 記帳</button>
    <button class="nav-btn" onclick="switchTab('schedule')">🗓 行程</button>
    <button class="nav-btn" onclick="switchTab('notes')">📝 備忘</button>
  </div>

  <div class="container">

    <!-- TAB 1: 記帳 Expense -->
    <div id="tab-expense" class="tab-content active">
      <div class="stats-card">
        <div style="font-size: 0.85rem; opacity: 0.9; text-align: center;">總支出概算</div>
        <div class="stats-grid">
          <div class="stats-item">
            <h4>日圓總額</h4>
            <p id="totalJPY">¥0</p>
          </div>
          <div class="stats-item">
            <h4>折合港幣</h4>
            <p id="totalHKD">HK$0.00</p>
          </div>
        </div>
      </div>

      <div class="filter-scroll" id="expenseFilters">
        <button class="filter-pill active" onclick="filterExpense('ALL')">全部</button>
        <button class="filter-pill" onclick="filterExpense('機票')">✈️ 機票</button>
        <button class="filter-pill" onclick="filterExpense('住宿')">🏨 住宿</button>
        <button class="filter-pill" onclick="filterExpense('餐飲')">美食</button>
        <button class="filter-pill" onclick="filterExpense('交通')">交通</button>
        <button class="filter-pill" onclick="filterExpense('購物')">購物</button>
        <button class="filter-pill" onclick="filterExpense('門票')">門票</button>
      </div>

      <div class="card" id="expenseList">
        <div class="empty">加載資料中...</div>
      </div>
    </div>

    <!-- TAB 2: 行程 Schedule -->
    <div id="tab-schedule" class="tab-content">
      <div class="filter-scroll" id="scheduleFilters">
        <button class="filter-pill active" onclick="filterSchedule('Day 1')">Day 1</button>
        <button class="filter-pill" onclick="filterSchedule('Day 2')">Day 2</button>
        <button class="filter-pill" onclick="filterSchedule('Day 3')">Day 3</button>
        <button class="filter-pill" onclick="filterSchedule('Day 4')">Day 4</button>
        <button class="filter-pill" onclick="filterSchedule('Day 5')">Day 5</button>
      </div>

      <div id="scheduleList">
        <div class="empty">加載行程中...</div>
      </div>
    </div>

    <!-- TAB 3: 備忘 Notes -->
    <div id="tab-notes" class="tab-content">
      <div class="card" id="notesList">
        <div class="empty">加載備忘錄中...</div>
      </div>
    </div>

  </div>

  <!-- Floating Add Button -->
  <button class="fab" onclick="openAddModal()">+</button>

  <!-- Add/Edit Modal Form -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">新增資料</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>

      <form id="mainForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="editId">
        <input type="hidden" id="formType">

        <!-- Expense Fields -->
        <div id="formFieldsExpense">
          <div class="form-row">
            <div class="form-group">
              <label>日期</label>
              <input type="date" id="expDate" class="form-control" required>
            </div>
            <div class="form-group">
              <label>時間</label>
              <input type="time" id="expTime" class="form-control">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>日圓 (JPY)</label>
              <input type="number" id="expJpy" class="form-control" placeholder="0" oninput="calcHKD()">
            </div>
            <div class="form-group">
              <label>港幣 (HKD)</label>
              <input type="number" step="0.01" id="expHkd" class="form-control" placeholder="0.00">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>類別</label>
              <select id="expCat" class="form-control">
                <option value="✈️ 機票">✈️ 機票</option>
                <option value="🏨 住宿">🏨 住宿</option>
                <option value="🍜 美食">🍜 美食</option>
                <option value="🚃 交通">🚃 交通</option>
                <option value="🛍️ 購物">🛍️ 購物</option>
                <option value="🎟️ 門票">🎟️ 門票</option>
                <option value="💡 其他">💡 其他</option>
              </select>
            </div>
            <div class="form-group">
              <label>付款方式</label>
              <select id="expPay" class="form-control">
                <option value="💳 Visa">💳 Visa</option>
                <option value="💵 現金">💵 現金</option>
                <option value="🐧 Suica/PayPay">🐧 Suica/PayPay</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>付款人</label>
              <input type="text" id="expPerson" class="form-control" placeholder="例：Cherry / Walter">
            </div>
            <div class="form-group">
              <label>費用類型</label>
              <input type="text" id="expKind" class="form-control" placeholder="例：事前/公用">
            </div>
          </div>
          <div class="form-group">
            <label>備註</label>
            <input type="text" id="expNote" class="form-control" placeholder="備註細節">
          </div>
        </div>

        <!-- Schedule Fields -->
        <div id="formFieldsSchedule" style="display: none;">
          <div class="form-row">
            <div class="form-group">
              <label>天數</label>
              <select id="schDay" class="form-control">
                <option value="Day 1">Day 1</option>
                <option value="Day 2">Day 2</option>
                <option value="Day 3">Day 3</option>
                <option value="Day 4">Day 4</option>
                <option value="Day 5">Day 5</option>
              </select>
            </div>
            <div class="form-group">
              <label>時間</label>
              <input type="time" id="schTime" class="form-control" value="09:00">
            </div>
          </div>
          <div class="form-group">
            <label>行程名稱</label>
            <input type="text" id="schTitle" class="form-control" placeholder="例：成田機場搭 Skyliner" required>
          </div>
          <div class="form-group">
            <label>地點 / 連結</label>
            <input type="text" id="schLocation" class="form-control" placeholder="例：上野站 / Google Map 連結">
          </div>
        </div>

        <!-- Notes Fields -->
        <div id="formFieldsNote" style="display: none;">
          <div class="form-group">
            <label>分類</label>
            <input type="text" id="noteCat" class="form-control" placeholder="例：必買清單 / 注意事項">
          </div>
          <div class="form-group">
            <label>標題</label>
            <input type="text" id="noteTitle" class="form-control" placeholder="項目標題" required>
          </div>
          <div class="form-group">
            <label>詳細內容</label>
            <textarea id="noteRemark" class="form-control" rows="3" placeholder="詳細內容..."></textarea>
          </div>
        </div>

        <button type="submit" class="btn">儲存並同步</button>
      </form>
    </div>
  </div>

  <script>
    // ⚠ 替換成你的 Google Apps Script Web App URL
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyf2v6G7J3R1vYv-3W5e2R_eH_43JpW4V5aE9-x02VfX/exec'; 

    let currentTab = 'expense';
    let expenses = [];
    let schedules = [];
    let notes = [];

    let currentExpFilter = 'ALL';
    let currentSchFilter = 'Day 1';

    // 匯率預設 JPY -> HKD
    const RATE = 0.052;

    document.addEventListener('DOMContentLoaded', () => {
      fetchData();
      // 設置預設日期
      document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
    });

    // 1. Fetch Data
    function fetchData() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          if(data.status === 'success' || data.expenses) {
            expenses = data.expenses || [];
            schedules = data.schedules || [];
            notes = data.notes || [];

            renderExpense();
            renderSchedule();
            renderNotes();
          }
        })
        .catch(err => console.error('Fetch Error:', err));
    }

    // 2. Tab Switch
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (tab === 'expense' && idx === 0) || (tab === 'schedule' && idx === 1) || (tab === 'notes' && idx === 2));
      });
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
    }

    // 3. Render Expense
    function renderExpense() {
      const container = document.getElementById('expenseList');
      let list = expenses;

      if (currentExpFilter !== 'ALL') {
        list = expenses.filter(e => e.cat.includes(currentExpFilter));
      }

      // 計算總金額
      let totalJpy = 0;
      let totalHkd = 0;
      expenses.forEach(e => {
        totalJpy += Number(e.jpy) || 0;
        totalHkd += Number(e.hkd) || 0;
      });

      document.getElementById('totalJPY').innerText = `¥${totalJpy.toLocaleString()}`;
      document.getElementById('totalHKD').innerText = `HK$${totalHkd.toFixed(2)}`;

      if (!list.length) return container.innerHTML = '<div class="empty">暫無記帳紀錄</div>';

      container.innerHTML = list.map(e => `
        <div class="record-item">
          <div class="record-info">
            <h3>${e.cat} - ${e.note || e.kind || '無備註'}</h3>
            <p>📅 ${e.date} | 💳 ${e.pay} (${e.person || '未填'})</p>
            <div class="record-actions">
              <span class="edit-btn" onclick="editExpense('${e.id}')">✏️ 編輯</span>
              <span class="delete-btn" onclick="deleteRecord('${e.id}', 'expense')">🗑️ 刪除</span>
            </div>
          </div>
          <div class="record-amount">
            <div class="amount-jpy">¥${(Number(e.jpy)||0).toLocaleString()}</div>
            <div class="amount-hkd">HK$${Number(e.hkd||0).toFixed(2)}</div>
          </div>
        </div>
      `).join('');
    }

    function filterExpense(cat) {
      currentExpFilter = cat;
      document.querySelectorAll('#expenseFilters .filter-pill').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(cat) || (cat === 'ALL' && btn.innerText === '全部'));
      });
      renderExpense();
    }

    // 4. Render Schedule (修復時間 1899-12-30T... 格式問題)
    function renderSchedule() {
      const container = document.getElementById('scheduleList');
      const list = schedules.filter(s => s.day === currentSchFilter);

      if (!list.length) return container.innerHTML = '<div class="empty">此天數暫無行程安排，點擊右下角「+」即可新增！</div>';

      // 格式化時間，過濾長字串只留 HH:mm
      function formatScheduleTime(timeStr) {
        if (!timeStr) return '09:00';
        let str = String(timeStr);
        if (str.includes('T')) {
          const timePart = str.split('T')[1];
          return timePart.substring(0, 5);
        }
        return str.substring(0, 5);
      }

      // 按時間排序
      list.sort((a, b) => formatScheduleTime(a.time).localeCompare(formatScheduleTime(b.time)));

      let html = '<div class="timeline">';
      html += list.map(s => {
        const cleanTime = formatScheduleTime(s.time);
        return `
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-card">
              <div class="timeline-header">
                <span class="timeline-time">⏰ ${cleanTime}</span>
                <div class="record-actions">
                  <span class="edit-btn" onclick="editSchedule('${s.id}')">✏️ 編輯</span>
                  <span class="delete-btn" onclick="deleteRecord('${s.id}', 'schedule')">🗑️️ 刪除</span>
                </div>
              </div>
              <div class="timeline-title">${s.title}</div>
              ${s.location ? `<div class="timeline-location">📍 ${s.location}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
      html += '</div>';

      container.innerHTML = html;
    }

    function filterSchedule(day) {
      currentSchFilter = day;
      document.querySelectorAll('#scheduleFilters .filter-pill').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === day);
      });
      renderSchedule();
    }

    // 5. Render Notes
    function renderNotes() {
      const container = document.getElementById('notesList');
      if (!notes.length) return container.innerHTML = '<div class="empty">暫無備忘事項</div>';

      container.innerHTML = notes.map(n => `
        <div class="record-item">
          <div class="record-info" style="width: 100%;">
            <h3>[${n.cat || '一般'}] ${n.title}</h3>
            <p>${n.remark || ''}</p>
            <div class="record-actions" style="margin-top: 5px;">
              <span class="delete-btn" onclick="deleteRecord('${n.id}', 'note')">🗑️ 刪除</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 6. Modal Operations
    function openAddModal() {
      document.getElementById('editId').value = '';
      document.getElementById('formType').value = currentTab;
      document.getElementById('modalTitle').innerText = `新增${currentTab === 'expense' ? '記帳' : currentTab === 'schedule' ? '行程' : '備忘'}`;

      document.getElementById('formFieldsExpense').style.display = currentTab === 'expense' ? 'block' : 'none';
      document.getElementById('formFieldsSchedule').style.display = currentTab === 'schedule' ? 'block' : 'none';
      document.getElementById('formFieldsNote').style.display = currentTab === 'notes' ? 'block' : 'none';

      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function calcHKD() {
      const jpy = parseFloat(document.getElementById('expJpy').value) || 0;
      document.getElementById('expHkd').value = (jpy * RATE).toFixed(2);
    }

    // 7. Edit Functions
    function editExpense(id) {
      const item = expenses.find(e => String(e.id) === String(id));
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('formType').value = 'expense';
      document.getElementById('expDate').value = item.date;
      document.getElementById('expTime').value = item.time;
      document.getElementById('expJpy').value = item.jpy;
      document.getElementById('expHkd').value = item.hkd;
      document.getElementById('expCat').value = item.cat;
      document.getElementById('expPay').value = item.pay;
      document.getElementById('expPerson').value = item.person;
      document.getElementById('expKind').value = item.kind;
      document.getElementById('expNote').value = item.note;

      document.getElementById('modalTitle').innerText = '編輯記帳';
      document.getElementById('formFieldsExpense').style.display = 'block';
      document.getElementById('formFieldsSchedule').style.display = 'none';
      document.getElementById('formFieldsNote').style.display = 'none';
      document.getElementById('modal').classList.add('active');
    }

    function editSchedule(id) {
      const item = schedules.find(s => String(s.id) === String(id));
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('formType').value = 'schedule';
      document.getElementById('schDay').value = item.day;
      
      let cleanTime = String(item.time);
      if (cleanTime.includes('T')) cleanTime = cleanTime.split('T')[1].substring(0, 5);
      document.getElementById('schTime').value = cleanTime.substring(0, 5);
      
      document.getElementById('schTitle').value = item.title;
      document.getElementById('schLocation').value = item.location;

      document.getElementById('modalTitle').innerText = '編輯行程';
      document.getElementById('formFieldsExpense').style.display = 'none';
      document.getElementById('formFieldsSchedule').style.display = 'block';
      document.getElementById('formFieldsNote').style.display = 'none';
      document.getElementById('modal').classList.add('active');
    }

    // 8. Submit Form (Save to Google Sheet)
    function handleFormSubmit(e) {
      e.preventDefault();
      const type = document.getElementById('formType').value;
      const id = document.getElementById('editId').value || 'local_' + Date.now();

      let payload = { id: id };

      if (type === 'expense') {
        payload.action = 'saveExpense';
        payload.date = document.getElementById('expDate').value;
        payload.time = document.getElementById('expTime').value || '00:00';
        payload.jpy = document.getElementById('expJpy').value || 0;
        payload.hkd = document.getElementById('expHkd').value || 0;
        payload.cat = document.getElementById('expCat').value;
        payload.pay = document.getElementById('expPay').value;
        payload.person = document.getElementById('expPerson').value;
        payload.kind = document.getElementById('expKind').value;
        payload.note = document.getElementById('expNote').value;
      } else if (type === 'schedule') {
        payload.action = 'saveSchedule';
        payload.day = document.getElementById('schDay').value;
        payload.time = document.getElementById('schTime').value;
        payload.title = document.getElementById('schTitle').value;
        payload.location = document.getElementById('schLocation').value;
      } else if (type === 'notes') {
        payload.action = 'saveNote';
        payload.cat = document.getElementById('noteCat').value || '一般';
        payload.title = document.getElementById('noteTitle').value;
        payload.remark = document.getElementById('noteRemark').value;
      }

      closeModal();

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        setTimeout(fetchData, 1000);
      });
    }

    // 9. Delete Item
    function deleteRecord(id, target) {
      if (!confirm('確定要刪除這筆資料嗎？')) return;

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete', id: id, target: target })
      }).then(() => {
        setTimeout(fetchData, 1000);
      });
    }
  </script>
</body>
</html>
